configuration_boundary_audit:
  date: '2026-09-24'
  class: review
  risk: high
  status: platform_turn_configuration_snapshot_in_progress
  scope: >-
    Confirmed configuration-boundary problems: pipeline initialization still
    influences per-UMO Agent selection, missing routed configurations silently
    fall back to default, and configuration metadata reads mutate shared mappings.
    Cron/proactive and plugin output remain lifecycle boundaries to converge later.
  non_goals: >-
    No runtime consumer migration, output contract changes, public plugin API deletion,
    or service restart. The new config domain projection is intentionally inert.
  followup: >-
    The default configuration is now the persisted global resource owner.
    Startup migrates legacy Profile-local Provider resources into it, deduping
    equal definitions and namespacing conflicting IDs while rewriting explicit
    Profile provider references; Profile platform lists become binding-ID
    admission lists. ProviderManager and PlatformManager initialization read
    the global registry. Explicit UMO configuration selection now rejects stale routes.
    EventBus now freezes explicit configuration selection into the existing
    InteractionTurnState before Pipeline scheduling. Cron/proactive turns,
    background result turns, Personal heartbeat, proactive output, and runtime
    observations now use one explicit selection; background results inherit
    their originating turn snapshot. The next batch must make Dashboard and
    ProviderManager resource CRUD explicitly target the global owner rather
    than retaining implicit default-config assumptions.
  validation_gap: >-
    Static lint and compilation pass. Direct standalone import of ProviderManager
    is blocked by the repository's existing PersonaManager -> astrbot.api ->
    KnowledgeBaseManager -> ProviderManager circular import; no service restart
    or full startup validation was performed.
    Preserve current worktree changes and review each batch before commit.
  current_batch: >-
    Configuration field audit has started. The first confirmed stale read was
    provider_settings.stream in the background-result wake path; it now uses
    the canonical provider_settings.streaming_response field. The initial
    field inventory is recorded in docs/Yakumo/dev/configuration-field-inventory.md.
    The obsolete default_kb_collection field was removed from defaults, schema,
    documentation, and the four local development profiles after confirming no
    runtime, Dashboard, or migration consumer remains.
    C3 compatibility projection now deep-copies the typed runtime snapshot, so
    legacy `_astrbot_config` mutation cannot alter per-turn configuration.
    C4 is complete: AgentRequest selects Internal versus ThirdParty from the
    admitted turn snapshot; ThirdParty reads runner configuration from that
    snapshot; PipelineScheduler preserves the selected compatibility projection
    instead of overwriting it with its initialization Profile; and WakingCheck now resolves wake, permission, continuation,
    Handler admission, and observation policy from the same frozen selection.
    StarRequest no longer caches unused profile configuration during Pipeline
    initialization. A focused snapshot-over-default WakingCheck regression test
    passed. The existing Pipeline import smoke remains blocked by the static
    Internal -> astr_main_agent -> Cron import chain when APScheduler is mocked
    incompletely; it was not widened in this configuration batch. C5 has begun
    with the Pipeline input-policy consumers: whitelist, rate limiting, and
    ambient conversation observation now resolve the admitted snapshot through
    one Pipeline helper. Preprocessing and content safety now also resolve the
    admitted snapshot, including STT gates, platform pre-ack, and selector
    construction. RespondStage now reads streaming and delivery settings from
    the snapshot, and ResultDecorate materializes a per-turn immutable policy
    for ordinary output behavior. ProcessStage's main coordination paths now
    use the admitted config and identity as well. Prompt 会话历史、记忆快照和
    人格关系 Collector 以及 Memory postprocess 服务选择现通过惰性投影优先读取
    typed turn snapshot；投影仅在消费时导入 Interaction，避免 Prompt/Memory 到
    turn_state 的静态反向依赖形成启动循环，并只为无 typed state 的旧直连入口
    保留 Event extra 回退。下一批审计 plugin_runtime、output_lifecycle 等仍直接
    读取配置投影的下游消费点，逐个确认其生命周期边界后迁移。Plugin Runtime 的
    capability target、MCP 搜索开关，以及输出前内容安全 selector 已完成迁移；
    运行时嵌套 target 配置会先做 Mapping 收敛，损坏局部结构按未配置处理。Core
    能力摘要、直接联网能力诊断、外部执行器身份和 Interaction Output Controller
    也已完成 typed-first 读取。全仓 Core 范围仅保留 turn_state 的集中兼容投影、
    Scheduler 的无快照旧入口写入，以及外部执行器在无 typed selection 时要求的
    显式 legacy 身份。C5 代码收敛完成；下一步是 C6 的真实双 UMO/Profile、配置
    重载中回合、Cron/主动任务一致性验收，而不是扩大回合快照到进程级注册表。
  latest_observation: >-
    2026-09-24 15:10 startup log showed ProviderManager repeatedly failing at
    copy.deepcopy(provider_config) with "cannot pickle 'mappingproxy' object".
    The registry projection was correctly immutable, but ProviderManager only
    shallow-copied its definitions and sources before passing them to legacy
    mutable provider loading. This made all configured providers unavailable;
