    download response semantics, or the user's unrelated dirty worktree.
  validation: >-
    Targeted RateLimiter, file-download, file-component, and knowledge-base
    retrieval tests passed; modified files passed Ruff, compileall, and git
    diff --check. An in-memory shared-provider smoke confirmed one embedding
    request for two knowledge bases. FAISS deferred persistence passed its
    reload smoke test. The modified attachment/web-search files passed Ruff,
    compileall, and diff checks; high-level test collection is currently
    blocked by pre-existing plugin_runtime/voice circular-import changes in
    the dirty worktree. Focused memory document-search tests passed.
  followup: >-
    After restart, run one cleaned URL ingestion with enough chunks to confirm
    bounded worker behavior and verify audio/TTS/download flows under normal
    traffic.

